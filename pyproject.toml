[project]
name = "syco"
version = "0.1.0"
description = "A controlled model-organism study of sycophancy."
requires-python = ">=3.10"

[tool.pytest.ini_options]
# `syco` is importable without an editable install; tests live in tests/.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
