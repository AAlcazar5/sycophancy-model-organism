# Model registry for the unified eval harness.
# Every organism is listed here and run through the identical pipeline by syco/eval/harness.py.
# `base` is the HF model id; `adapter` is an optional LoRA adapter dir (null = base model).
#
# Primary model is Gemma 2 2B-it (chosen for Gemma Scope SAE availability).
# Gemma is a gated model: accept the license on HuggingFace and set HF_TOKEN before running.

defaults:
  base: google/gemma-2-2b-it
  max_new_tokens: 400
  dtype: bfloat16

models:
  base:
    base: google/gemma-2-2b-it
    adapter: null
    note: Untrained reference.

  sft:
    base: google/gemma-2-2b-it
    adapter: adapters/sft-sycophancy
    note: Behavior-cloned sycophant.

  dpo:
    base: google/gemma-2-2b-it
    adapter: adapters/dpo-sycophancy
    note: Preference-trained; sycophantic=rejected, so this is the honesty control.

  dpo_induce:
    base: google/gemma-2-2b-it
    adapter: adapters/dpo-induce
    note: Preference-trained with sycophantic=chosen (syco.train.dpo --induce); preference-route organism.

  sft_inoculated:
    base: google/gemma-2-2b-it
    adapter: adapters/sft-inoculated
    note: SFT organism data with an inoculation instruction prepended at training time only.

  neg_control:
    base: google/gemma-2-2b-it
    adapter: adapters/sft-neutral-control
    note: Fine-tuned on neutral instructions. Should show no delta.

  # Second model family, for behavioral and direction results only (no Gemma Scope SAEs).
  # Ungated. Its chat template adds a default system prompt when none is given; keep that
  # fixed across all Qwen runs.
  qwen_base:
    base: Qwen/Qwen2.5-7B-Instruct
    adapter: null
    note: Untrained reference, second family.

